<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WRASB盤點DEMO</title>
  <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.2.0/socket.io.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    /* 白字黑框 */
    .text-shadow {
      color: #ffffff;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000;
    }
    /* 讓 section = 一個螢幕高度 - footer 高度 */
    #home-page {
      height: calc(100vh - 70px);
      min-height: calc(100vh - 70px);
      position: relative;
      overflow: hidden;
    }
    /* 背景遮罩 */
    #home-page .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }
    /* Footer 固定高度 */
    footer {
      height: 70px;
      line-height: 70px;
    }
    /* 卡片在手機上更美觀 */
    @media (max-width: 768px) {
      #home-page {
        height: auto;
        min-height: calc(100vh - 70px);
        padding-top: 60px;
        padding-bottom: 60px;
      }
      h1.display-5 {
        font-size: 1.7rem;
      }
      .card {
        margin-bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- 首頁 Section -->
  <section id="home-page" class="d-flex align-items-center text-center text-white"
    style="
      background-image: url('https://www-ws.wra.gov.tw/001/Upload/433/relpic/10011/146237/2fc95d79-f3ff-41df-b87e-84a54371955f.png');
      background-size: cover;
      background-position: center;
    ">
    <div class="bg-overlay"></div>
    <div class="container position-relative">
      <h1 class="display-5 fw-bold mb-5 text-shadow">
        南區水資源分署不動產盤點系統DEMO
      </h1>
      <div class="row g-4 justify-content-center">
        <!-- 卡片 1 -->
        <div class="col-md-5 col-11">
          <div class="card bg-dark bg-opacity-75 text-white shadow-lg">
            <div class="card-body">
              <h2 class="h4 mb-4">土地盤點系統</h2>
              <ul class="text-start small lh-lg">
                <li>查詢及顯示土地位置</li>
                <li>快速連結Google地圖定位</li>
                <li>產生盤點結果文件</li>
              </ul>
              <div class="d-flex gap-2 justify-content-center mt-4">
                <button class="btn btn-outline-primary w-100"
                  onclick="window.location.href='https://joe123890508.github.io/wrasb_land.github.io/land.html';">
                  土地盤點 🚨
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- 卡片 2 -->
        <div class="col-md-5 col-11">
          <div class="card bg-dark bg-opacity-75 text-white shadow-lg">
            <div class="card-body">
              <h2 class="h4 mb-4">土改及建物盤點系統</h2>
              <ul class="text-start small lh-lg">
                <li>查詢及顯示土改、建物位置</li>
                <li>依照條件篩選土改與建物</li>
                <li>快速連結Google 地圖定位</li>
              </ul>
              <div class="d-flex gap-2 justify-content-center mt-4">
                <button class="btn btn-outline-primary w-100"
                  onclick="window.location.href='https://joe123890508.github.io/wrasb_land.github.io/facility.html';">
                  土改及建物盤點 🚨
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Footer -->
  <footer class="bg-black text-white text-center">
    © <strong>2025 <a href="https://www.wra.gov.tw/wrasb/" class="text-decoration-none text-primary">WRASB</a></strong>.
    All rights reserved.
  </footer>
</body>
</html>
