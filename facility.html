<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南水分署土改及建物盤點系統</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <!-- Leaflet & Plugins -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css"/>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .container-fluid {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #main-container {
      flex: 1;
      min-height: 0;
    }
    footer {
      height: 30px;
      line-height: 30px;
      position: relative;
      flex-shrink: 0;
    }
    #map, #search { height: 95%; }
    @media (max-width: 767.98px) {
      footer {
        height: 20px;
        line-height: 20px;
      }
      #main-container { 
        flex: 1;
        min-height: 0;
      }
      /* 頁面標題緊湊化 */
      h1 {
        font-size: 1.25rem;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
      }
      #map { 
        flex: 1;
        max-height: 35vh;
      }
      /* 搜尋區塊高動態調整 */
      #search {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        max-height: 50vh;
        overflow-x: hidden;
      }
      /* 搜尋表單縮小字體與間距 */
      #search_area .col-4 {
        width: 35%;
        font-size: 0.875rem;
        padding-right: 0;
      }
      #search_area .col-8 { width: 65%; }
      .form-control, .form-select {
        font-size: 0.875rem;
        padding: 0.25rem 0.5rem;
      }
      .form-label, .col-form-label {
        padding-top: 0.25rem;
        padding-bottom: 0.25rem;
      }
      #search_result { max-height: 250px; }
      #search_result table { font-size: 0.8rem; }
      #search_result th, #search_result td { padding: 0.3rem 0.2rem; }
      .search-button {
        padding: 0.1rem 0.4rem;
        font-size: 0.75rem;
      }
      .basemap img { width: 48px; }
      .leaflet-control-layers-list {
        max-height: 160px;
        font-size: 0.8rem;
      }
      /* 手機版 Modal 微調 */
      .modal-dialog { margin: 0.75rem; }
    }
    /* 底圖選擇器 */
    .basemaps { padding: 4px; }
    .basemaps.closed .basemap { display: none; }
    .basemaps.closed .basemap.alt { display: inline-block; }
    .basemaps.closed .basemap.alt h4 { display: none; }
    .basemap { display: inline-block; cursor: pointer; }
    .basemap.active img { border-color: orange; box-shadow: 2px 2px 4px #000; }
    .basemap img { width: 70px; border: 2px solid #FFF; margin: 0 2px; border-radius: 50%; box-shadow: 0 1px 5px rgba(0,0,0,0.65); }
    /* Leaflet 圖層控制選項美化 */
    .leaflet-control-layers label { display: flex; align-items: center; padding: 6px 8px; cursor: pointer; border-radius: 6px; transition: background-color 0.3s; user-select: none; }
    .leaflet-control-layers label:hover { background-color: #f0f8ff; }
    .leaflet-control-layers input[type="checkbox"],
    .leaflet-control-layers input[type="radio"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
    .leaflet-control-layers-list { max-height: 250px; overflow-y: auto; padding-right: 4px; }
    .leaflet-control-layers-list::-webkit-scrollbar { width: 6px; }
    .leaflet-control-layers-list::-webkit-scrollbar-thumb { background-color: #4a90e2; border-radius: 3px; }
    #featureModal .modal-content {
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }
    #featureModal .modal-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      padding: 0.9rem 1.25rem;
    }
    #featureModal .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a252f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #featureModal .modal-body {
      background-color: #ffffff;
      max-height: 65vh;
    }
    /* Modal 特徵資訊表格美化 */
    .custom-feature-table {
      width: 100%;
      font-size: 0.875rem;
      border-collapse: collapse;
    }
    .custom-feature-table th {
      width: 35%;
      background-color: #f8f9fa;
      color: #495057;
      font-weight: 600;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #edf2f7;
      vertical-align: top;
      white-space: nowrap;
    }
    .custom-feature-table td {
      color: #212529;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #edf2f7;
      vertical-align: top;
      word-break: break-word;
    }
    .custom-feature-table tr:last-child th,
    .custom-feature-table tr:last-child td {
      border-bottom: none;
    }
    .custom-feature-table tr:hover {
      background-color: #f1f5f9;
    }
    #featureModal .modal-footer {
      border-top: 1px solid #e9ecef;
      padding: 0.75rem 1.25rem;
      background-color: #f8f9fa;
    }
    #google_map {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
    }
  </style>
</head>

<body>
<div class="container-fluid px-3">
  <h1 class="h2 text-center my-3 fw-bold">南水分署土改及建物盤點系統</h1>
  <!-- 全螢幕 Loading 遮罩 -->
  <div id="loading-overlay" class="position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex justify-content-center align-items-center fs-5 fw-bold text-secondary" style="z-index: 9999;">
    資料載入中，請稍候...
  </div>
  <!-- 主佈局區塊 -->
  <div id="main-container" class="row g-3">
    <!-- 左側 / 上方：搜尋與結果區 -->
    <div id="search" class="col-12 col-md-6 d-flex flex-column h-100">
      <div id="search_area" class="sticky-top bg-white pt-2 pb-2 z-1">
        <div class="row mb-2 align-items-center">
          <label for="number" class="col-4 col-form-label">財產編號：</label>
          <div class="col-8">
            <input type="text" id="number" name="number" class="form-control"/>
          </div>
        </div>
        <div class="row mb-2 align-items-center">
          <label for="unit" class="col-4 col-form-label">保管單位：</label>
          <div class="col-8">
            <select id="unit" class="form-select"></select>
          </div>
        </div>
        <div class="row mb-2 align-items-center">
          <label for="people" class="col-4 col-form-label">保管人：</label>
          <div class="col-8">
            <input type="text" id="people" name="people" class="form-control"/>
          </div>
        </div>
        <div class="row mb-2 align-items-center">
          <label for="card" class="col-4 col-form-label">是否貼牌：</label>
          <div class="col-8">
            <select id="card" class="form-select">
              <option value="請選擇">請選擇</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
        </div>
        <div class="row mb-2 align-items-center">
          <label for="qr" class="col-4 col-form-label">是否QRCode：</label>
          <div class="col-8">
            <select id="qr" class="form-select">
              <option value="請選擇">請選擇</option>
              <option value="有">是</option>
              <option value="無">否</option>
            </select>
          </div>
        </div>
        <div class="row mt-3 justify-content-center">
          <div class="col-10">
            <button type="button" class="btn btn-primary w-100" id="confirm">查詢</button>
          </div>
        </div>
      </div>
      <div id="search_result" class="flex-grow-1 overflow-auto pt-2">
        <table class="table table-striped table-hover text-center align-middle">
          <thead class="table-light sticky-top">
            <tr>
              <th scope="col">財產編號</th>
              <th scope="col">保管單位</th>
              <th scope="col">保管人</th>
              <th scope="col">位置</th>
            </tr>
          </thead>
          <tbody id="search_result_list"></tbody>
        </table>
      </div>
    </div>
    <!-- 右側 / 下方：地圖區 -->
    <div id="map" class="col-12 col-md-6 rounded border">
      <!-- Modal 特徵詳情 -->
      <div class="modal fade" id="featureModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="feature-title"></h5>
              <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" id="feature-info"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" id="google_map">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                  <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
                </svg>
                在 Google 地圖開啟
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<footer class="bg-black text-white text-center">
  © <strong>2025 <a href="https://www.wra.gov.tw/wrasb/" class="text-decoration-none text-primary">WRASB</a></strong>.
  All rights reserved.
</footer>
<script type="module" src="./facility.js"></script>
</body>
</html>
